name: habitsxd
description: HabitsXD — Powerful Productivity & Habit Tracker App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.5
  cloud_firestore: ^4.17.4
  firebase_storage: ^11.7.6
  firebase_analytics: ^10.10.6
  google_generative_ai: ^0.4.3
  flutter_quill: ^9.4.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  table_calendar: ^3.1.1
  flutter_heatmap_calendar: ^1.0.5
  flutter_local_notifications: ^17.1.2
  http: ^1.2.1
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  lucide_icons: ^0.0.2
  gap: ^3.0.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  animate_do: ^3.3.4
  flutter_slidable: ^3.1.0
  modal_bottom_sheet: ^3.0.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_markdown: ^0.7.3
  google_fonts: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.ttf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.ttf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Bold.ttf
          weight: 700
